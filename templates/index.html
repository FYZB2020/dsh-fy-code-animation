<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>__TITLE__</title>
<style>
  :root {
    --bg0: #07080c;
    --bg1: #101520;
    --ink: #f4f1ea;
    --dim: #8f97a8;
    --accent: __ACCENT__;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg0); }
  body { font-family: "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: var(--ink); }

  #stage { position: absolute; inset: 0; background: radial-gradient(120% 90% at 20% 0%, var(--bg1), var(--bg0) 62%); }
  #grid {
    position: absolute; inset: 0; opacity: .18;
    background-image: linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 6.25% 6.25%;
  }
  #glow { position: absolute; width: 70%; height: 70%; left: 8%; top: 12%; filter: blur(90px); opacity: .30;
          background: radial-gradient(closest-side, var(--accent), transparent 70%); }
  #rule { position: absolute; left: 8%; right: 8%; top: 50%; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,.18), transparent); }

  .scene { position: absolute; left: 8%; right: 8%; top: 34%; opacity: 0; }
  .kicker { font-size: 1.1vw; letter-spacing: .3em; color: var(--accent); text-transform: uppercase; margin-bottom: 1.4vw; }
  .line { font-size: 4.1vw; line-height: 1.34; font-weight: 650; letter-spacing: .01em; text-wrap: balance; }
  .sub { margin-top: 1.5vw; font-size: 1.35vw; line-height: 1.7; color: var(--dim); max-width: 62%; }

  #bar { position: absolute; left: 8%; right: 8%; bottom: 7.5%; height: 2px; background: rgba(255,255,255,.12); }
  #fill { height: 100%; width: 0; background: var(--accent); }
  #meta { position: absolute; left: 8%; bottom: 4.4%; font-size: .95vw; letter-spacing: .22em; color: var(--dim); }
  #count { position: absolute; right: 8%; bottom: 4.4%; font-size: .95vw; letter-spacing: .22em; color: var(--dim); }
  #title { position: absolute; left: 8%; top: 8.5%; font-size: 1vw; letter-spacing: .35em; color: var(--dim); text-transform: uppercase; }
  #sceneNo { position: absolute; right: 8%; top: 8.2%; font-size: 2.4vw; font-weight: 700; color: rgba(255,255,255,.14); letter-spacing: .04em; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="glow"></div>
  <div id="rule"></div>
  <div id="title">__TITLE__</div>
  <div id="sceneNo">01</div>
  <div id="scenes"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="meta">__META__</div>
  <div id="count"></div>
</div>
<script>
  const TIMELINE = __TIMELINE__;
  const DURATION = __DURATION__;
  const host = document.getElementById('scenes');
  const pad = (n) => String(n).padStart(2, '0');

  const scenes = TIMELINE.map((s, i) => {
    const el = document.createElement('div');
    el.className = 'scene';
    const kicker = document.createElement('div');
    kicker.className = 'kicker';
    kicker.textContent = s.kicker || ('SCENE ' + pad(i + 1));
    const line = document.createElement('div');
    line.className = 'line';
    line.textContent = s.text || '';
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = s.note || '';
    el.append(kicker, line, sub);
    host.append(el);
    return { el, line, full: s.text || '', start: Number(s.start), end: Number(s.end) };
  });

  const fill = document.getElementById('fill');
  const count = document.getElementById('count');
  const sceneNo = document.getElementById('sceneNo');

  function clamp(x) { return Math.max(0, Math.min(1, x)); }

  // 任意 t 都能重现同一帧：不读时钟、不累加状态、不用 Math.random。
  window.renderAt = async function (t) {
    const tt = Math.max(0, Math.min(DURATION, Number(t) || 0));
    fill.style.width = (tt / DURATION) * 100 + '%';
    count.textContent = pad(Math.ceil(tt)) + ' / ' + pad(Math.round(DURATION)) + ' S';
    let active = 0;
    scenes.forEach((s, i) => {
      const visible = tt >= s.start && tt < s.end;
      if (!visible) { s.el.style.opacity = '0'; return; }
      active = i;
      const p = clamp((tt - s.start) / Math.max(0.001, s.end - s.start));
      const fadeIn = clamp(p / 0.18);
      const fadeOut = clamp((1 - p) / 0.16);
      const op = Math.min(fadeIn, fadeOut);
      s.el.style.opacity = String(op);
      s.el.style.transform = 'translateY(' + ((1 - fadeIn) * 18 - (1 - fadeOut) * 8).toFixed(2) + 'px)';
      const shown = Math.ceil(s.full.length * clamp(p * 2.2));
      s.line.textContent = s.full.slice(0, shown);
    });
    sceneNo.textContent = pad(active + 1);
  };

  // ?export=1 时不主动播放，交给渲染器逐帧驱动
  if (!/[?&]export=1/.test(location.search)) {
    const t0 = performance.now();
    const loop = () => {
      const t = ((performance.now() - t0) / 1000) % DURATION;
      window.renderAt(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else {
    window.renderAt(0);
  }
</script>
</body>
</html>
